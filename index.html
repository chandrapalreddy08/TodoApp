<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoList</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <div class="stats-container">
            <div class="details">
                <h1>Todo App</h1>
                <p>Keep it up!</p>
                <div id="progressBar">
                    <div id="progress"></div>
                </div>
            </div>
            <div class="stats-numbers">
                <p id="numbers">0 / 0</p>
            </div>
        </div>
        <form action="">
            <input id="taskInput" type="text" placeholder="Write your task">
            <button id="newTask" type="submit">+</button>
        </form>
        <ul id="task-list"></ul>
    </div>
    <footer class="footer">
    <p>© 2026 Todo App | Built with ❤️ by CPR</p>
</footer>

    <script src="app.js" defer></script>
     <script
            src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@4.0.5/tsparticles.confetti.bundle.min.js"></script>
          
</body>
</html>
